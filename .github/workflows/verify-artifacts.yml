name: verify-artifacts

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate artifacts
        run: npm run validate:artifacts
      - name: Drift gate
        run: npm run drift:artifacts
