name: Next.js build

on:
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/next-build.yml'
      - 'tsconfig.json'
  push:
    branches:
      - main

concurrency:
  group: next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        env:
          NEXT_PUBLIC_ENABLE_AUDIT: 'true'
        run: npm run lint

      - name: Build app
        env:
          NEXT_PUBLIC_ENABLE_AUDIT: 'true'
        run: npm run build

      - name: Smoke manifest API
        env:
          NEXT_PUBLIC_ENABLE_AUDIT: 'true'
        run: |
          npm start &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          sleep 5
          npm run check:manifest:api
