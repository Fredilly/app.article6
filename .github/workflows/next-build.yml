name: Next.js build

on:
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/next-build.yml'
      - 'tsconfig.json'
  push:
    branches:
      - main

concurrency:
  group: next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        env:
          NEXT_PUBLIC_ENABLE_AUDIT: 'true'
        run: npm run lint

      - name: Build app
        env:
          NEXT_PUBLIC_ENABLE_AUDIT: 'true'
        run: npm run build

      - name: Ensure manifest not empty
        run: npm run check:manifest

      - name: Start Next.js server
        env:
          NEXT_PUBLIC_ENABLE_AUDIT: 'true'
        run: |
          npm start &
          echo $! > .next-server-pid
          sleep 5

      - name: Smoke manifest API
        run: npm run check:manifest:api

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-server-pid ]; then
            kill $(cat .next-server-pid) || true
            rm .next-server-pid
          fi
