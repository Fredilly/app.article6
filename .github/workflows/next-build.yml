name: Next.js build

on:
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/next-build.yml'
      - 'tsconfig.json'
  push:
    branches:
      - main

concurrency:
  group: next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5dff0b4bfb52f860d0d0d6b403ed1c1ec3

      - name: Use Node.js 20
        uses: actions/setup-node@60edb5dd254dff258ba7707d30f08259f4003e8f
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint AND Build
        env:
          NEXT_PUBLIC_ENABLE_AUDIT: 'true'
        run: |
          npm run lint
          npm run build
