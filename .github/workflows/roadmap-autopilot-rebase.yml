name: roadmap-autopilot-rebase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    if: startsWith(github.event.pull_request.head.ref, 'automation/roadmap-pr-') || startsWith(github.event.pull_request.head.ref, 'bot/roadmap-autopilot/pr-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rebase on main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Push rebase
        run: git push --force-with-lease
