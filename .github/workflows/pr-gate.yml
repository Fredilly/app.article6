name: pr-gate

on:
  pull_request:

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Audit pack determinism
        run: npm run determinism:audit-pack -- AR-ACM0003 v02-0

      - name: Audit pack smoke
        run: npm run test:audit-pack:smoke

      - name: Roadmap status gate
        run: npm run roadmap:check

      - name: Status drift check
        run: npm run status:check
